<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Single Page App GitHub Pages redirect restore script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <title>Telemetry Insight — Vehicle Telemetry Verification POC</title>
    <meta name="description" content="Automated vehicle telemetry software verification POC with CAN/LIN log ingestion, IQR cleaning, and heuristic anomaly detection." />
    <meta name="author" content="Skip (https://goskip.dev)" />
    <meta property="og:image" content="/og-image.png" />
  </head>
